 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="panell">
    <div class="header">Joc de Memòria</div>
    <div class="memory-next" id="notification">
    </div>
    <div class="memory-game">
        <div class="row">
            <button class="card color1" id="bColor1" onclick="comprovarColor('#005f73')"></button>
            <button class="card color2" id="bColor2" onclick="comprovarColor('#0a9396')"></button>
            <button class="card color3" id="bColor3" onclick="comprovarColor('#94d2bd')"></button>
        </div>
        <div class="row">
            <button class="card color4" id="bColor4" onclick="comprovarColor('#e9d8a6')"></button>
            <button class="card color5" id="bColor5" onclick="comprovarColor('#ee9b00')"></button>
            <button class="card color6" id="bColor6" onclick="comprovarColor('#ca6702')"></button>
        </div>
        <div class="row">
            <button class="card color7" id="bColor7" onclick="comprovarColor('#bb3e03')"></button>
            <button class="card color8" id="bColor8" onclick="comprovarColor('rgba(174, 32, 18, 0.89)')"></button>
            <button class="card color9" id="bColor9" onclick="comprovarColor('#9b2226')"></button>
        </div>

    </div>
<!--    Misatge que mostram (nivells)-->
    <div class="memory-message" id="message">
    </div>

    <div class="memory-message" id="botoReiniciar">
        <button id="reinicia" class="button-2" role="button"  onclick="inici()">Reiniciar</button>
    </div>

    <div class="buttons" id="botoComencar">
        <button class="button-3" role="button"  onclick="inici()">Començar</button>
    </div>

    <script src="script.js"></script>

</div>

</body>
</html>
